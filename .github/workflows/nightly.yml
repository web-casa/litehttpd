name: Nightly

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  schedule:
    - cron: '17 3 * * *'  # 3:17 UTC daily
  workflow_dispatch:       # manual trigger

jobs:
  apps-matrix-runtime-images:
    uses: ./.github/workflows/apps-matrix-runtime-images.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      image_tag: ${{ github.sha }}
      extra_tag: nightly
      push_images: "1"

  # ── Sanitizer + Fuzz ──────────────────────────────────────────────
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libpcre2-dev ninja-build pkg-config

      - name: Build parser fuzzer
        run: |
          mkdir -p fuzz-build
          for src in \
            src/htaccess_cidr.c \
            src/htaccess_parser.c \
            src/htaccess_directive.c \
            src/htaccess_expr.c \
            src/htaccess_expires.c; do
            obj="fuzz-build/$(basename "${src}" .c).o"
            clang -g -O1 -fsanitize=address -I include \
              -DHTACCESS_UNIT_TEST \
              -c "${src}" -o "${obj}"
          done
          clang++ -g -O1 -fsanitize=address -I include -I tests \
            -DHTACCESS_UNIT_TEST \
            -c tests/mock_lsiapi.cpp -o fuzz-build/mock_lsiapi.o
          clang++ -g -O1 -fsanitize=address -I include -I tests \
            -DHTACCESS_UNIT_TEST \
            -DFUZZING_BUILD_MODE_UNSAFE_FOR_PRODUCTION \
            -c tests/fuzz/fuzz_parser.cpp -o fuzz-build/fuzz_parser.o
          clang++ -g -O1 -fsanitize=fuzzer,address \
            fuzz-build/*.o \
            -lm \
            -o fuzz_parser

      - name: Run parser fuzzer (5 minutes)
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p fuzz_corpus
          cp tests/fuzz/corpus/* fuzz_corpus/
          timeout 300 ./fuzz_parser fuzz_corpus/ \
            -max_len=4096 \
            -timeout=5 \
            || true
          echo "Fuzzer completed"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: |
            crash-*
            oom-*

  # ── OLS Container Smoke Tests ─────────────────────────────────────
  ols-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpcre2-dev ninja-build pkg-config

      - name: Build module
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel "$(nproc)"

      - name: Start OLS container
        run: |
          docker build -t ols-smoke -f tests/e2e/Dockerfile .
          docker run -d --name ols-smoke -p 8088:8088 ols-smoke
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8088/ > /dev/null 2>&1; then
              echo "OLS ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Smoke test — Header directives
        run: |
          docker exec ols-smoke bash -c 'echo "Header set X-Smoke yes" > /var/www/vhosts/localhost/html/.htaccess'
          sleep 0.5
          curl -sI http://localhost:8088/index.html | grep -qi "X-Smoke: yes"
          echo "PASS: Header set"

      - name: Smoke test — Redirect
        run: |
          docker exec ols-smoke bash -c 'echo "Redirect 301 /smoke-redir /smoke-target" > /var/www/vhosts/localhost/html/.htaccess'
          sleep 0.5
          RESP=$(curl -sI http://localhost:8088/smoke-redir)
          echo "$RESP" | grep -q "301"
          echo "$RESP" | grep -qi "Location.*smoke-target"
          echo "PASS: Redirect 301"

      - name: Smoke test — FilesMatch ACL
        run: |
          docker exec ols-smoke bash -c '
            echo "test" > /var/www/vhosts/localhost/html/secret.env
            cat > /var/www/vhosts/localhost/html/.htaccess <<EOF
          <FilesMatch "\.(env|log)$">
              Order allow,deny
              Deny from all
          </FilesMatch>
          EOF
          '
          sleep 0.5
          STATUS=$(curl -sI http://localhost:8088/secret.env -o /dev/null -w "%{http_code}")
          test "$STATUS" = "403"
          echo "PASS: FilesMatch ACL (403)"

      - name: Smoke test — Access Control
        run: |
          docker exec ols-smoke bash -c 'echo -e "Order Allow,Deny\nDeny from all" > /var/www/vhosts/localhost/html/.htaccess'
          sleep 0.5
          STATUS=$(curl -sI http://localhost:8088/ -o /dev/null -w "%{http_code}")
          test "$STATUS" = "403"
          echo "PASS: Deny from all (403)"

      - name: Smoke test — Mixed directives (no crash)
        run: |
          docker exec ols-smoke bash -c '
            cat > /var/www/vhosts/localhost/html/.htaccess <<EOF
          AddDefaultCharset UTF-8
          DefaultType application/octet-stream
          Header set X-Mixed yes
          RewriteEngine On
          RewriteRule ^test$ /index.html [L]
          EOF
          '
          sleep 0.5
          RESP=$(curl -sI http://localhost:8088/index.html)
          echo "$RESP" | grep -qi "X-Mixed: yes"
          echo "PASS: Mixed directives (no crash)"

      - name: Cleanup
        if: always()
        run: docker rm -f ols-smoke || true

  # ── OLS PHP Application E2E Tests (moved from ci.yml) ─────────────
  ols-app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpcre2-dev ninja-build pkg-config

      - name: Build module
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel "$(nproc)" --target litehttpd_htaccess

      - name: Start app stack
        run: docker compose -f tests/e2e/docker-compose.yml up -d --build

      - name: Wait for services
        run: bash tests/e2e/lib/wait_for_services.sh

      - name: Run PHP app tests
        run: bash tests/e2e/test_apps.sh --all

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f tests/e2e/docker-compose.yml logs ols || true
          docker compose -f tests/e2e/docker-compose.yml exec ols cat /usr/local/lsws/logs/error.log || true

      - name: Cleanup
        if: always()
        run: docker compose -f tests/e2e/docker-compose.yml down -v

  # ── Apps Matrix Full Three-Engine Run ─────────────────────────────
  apps-matrix-full:
    needs: apps-matrix-runtime-images
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - wordpress-core
          - wordpress-redirection
          - laravel
          - drupal
          - nextcloud
          - wordpress-wordfence
          - wordpress-w3-total-cache
          - wordpress-litespeed-cache
          - wordpress-ewww
          - wordpress-wp-optimize
          - joomla
          - mediawiki

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install apps-matrix deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 composer curl default-mysql-client php-cli php-mysql tar unzip

      - name: Cache apps-matrix downloads
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/apps-matrix-cache/downloads
          key: apps-matrix-downloads-${{ hashFiles('tests/e2e/apps-matrix/config/versions.env') }}
          restore-keys: |
            apps-matrix-downloads-

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: apps-matrix-composer-${{ runner.os }}-${{ hashFiles('tests/e2e/apps-matrix/config/versions.env') }}
          restore-keys: |
            apps-matrix-composer-${{ runner.os }}-

      - name: Build apps-matrix fixture image
        run: docker build -t apps-matrix-fixture -f tests/e2e/apps-matrix/Dockerfile.fixture .

      - name: Run apps-matrix full matrix
        env:
          MATRIX_OUT_DIR: ${{ runner.temp }}/apps-matrix-full/${{ matrix.scenario }}
          MATRIX_SCENARIO: ${{ matrix.scenario }}
          MATRIX_TIER: nightly
          MATRIX_FIXTURE_MODE: real
          MATRIX_REAL_ALLOW_NETWORK: 0
          MATRIX_REAL_DOWNLOAD_DIR: ${{ runner.temp }}/apps-matrix-cache/downloads
          MATRIX_REAL_RUN_APP_INSTALL: 0
          MATRIX_REAL_DEEP_CONFIG: 1
          MATRIX_REAL_VALIDATE_CONFIG: 1
          MATRIX_COMPOSE_BUILD: 0
          MATRIX_APACHE_IMAGE: ${{ needs.apps-matrix-runtime-images.outputs.apache_image }}
          MATRIX_OLS_MODULE_IMAGE: ${{ needs.apps-matrix-runtime-images.outputs.ols_module_image }}
          MATRIX_PER_ENGINE_BUDGET_MS: 15000
          MATRIX_SCENARIO_BUDGET_MS: 3600000
          MATRIX_ARTIFACT_MODE: summary
        run: bash tests/e2e/apps-matrix/run_full_matrix.sh

      - name: Prepare apps-matrix summary artifacts
        if: always()
        run: |
          python3 tests/e2e/apps-matrix/lib/collect_artifact_manifest.py \
            --out-dir "${RUNNER_TEMP}/apps-matrix-full/${{ matrix.scenario }}" \
            --mode summary \
            --copy-to "${RUNNER_TEMP}/apps-matrix-full-summary/${{ matrix.scenario }}" \
            > /dev/null

      - name: Upload apps-matrix summary artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-matrix-full-${{ matrix.scenario }}
          path: ${{ runner.temp }}/apps-matrix-full-summary/${{ matrix.scenario }}
          if-no-files-found: ignore

  # ── Integration Tests: 4 PHP Apps (moved from ci.yml) ─────────────
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpcre2-dev ninja-build pkg-config

      - name: Build module
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --parallel "$(nproc)" --target litehttpd_htaccess

      - name: Start integration test stack
        run: docker compose -f integration-tests/docker-compose.yml up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8088/ > /dev/null 2>&1; then
              echo "OLS ready after ${i}s"
              break
            fi
            sleep 1
          done
          for i in $(seq 1 60); do
            if docker exec ols-integ-db mariadb -uroot -prootpass -e "SELECT 1" > /dev/null 2>&1; then
              echo "MariaDB ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run WordPress tests
        run: bash integration-tests/apps/wordpress/verify.sh

      - name: Run Laravel tests
        run: bash integration-tests/apps/laravel/verify.sh

      - name: Run Nextcloud tests
        run: bash integration-tests/apps/nextcloud/verify.sh

      - name: Run Drupal tests
        run: bash integration-tests/apps/drupal/verify.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          docker exec ols-integ cat /usr/local/lsws/logs/error.log 2>/dev/null | tail -100 || true
          docker compose -f integration-tests/docker-compose.yml logs --tail=50 || true

      - name: Cleanup
        if: always()
        run: docker compose -f integration-tests/docker-compose.yml down -v
