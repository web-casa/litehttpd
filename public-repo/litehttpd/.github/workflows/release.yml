name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Let `gh` resolve the repo without needing a git checkout (create-release
  # has no checkout step) and authenticate with the workflow token.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-22.04
    outputs:
      can_publish: ${{ steps.gate.outputs.can_publish }}
    steps:
      - name: Publishing gate
        id: gate
        # secrets are only readable at STEP level, not in job-level if:
        # export the verdict as a job output consumers can gate on
        run: '[ -n "${{ secrets.GPG_PRIVATE_KEY }}" ] && echo can_publish=true >> "$GITHUB_OUTPUT" || echo can_publish=false >> "$GITHUB_OUTPUT"'

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release source isolation
        run: |
          bash scripts/check-release-source-isolated.sh \
            --ref "$GITHUB_SHA" \
            --expect-sha "$GITHUB_SHA" \
            --manifest-dir out/release-preflight/source

      - name: Validate release metadata
        run: |
          bash scripts/check-release-metadata.sh \
            --tag "$GITHUB_REF_NAME" \
            --manifest-dir out/release-preflight/metadata

      - name: Validate budget policy
        run: bash scripts/check-apps-matrix-budget-policy.sh

      - name: Report public mirror sync delta
        run: |
          bash scripts/check-public-release-sync.sh \
            --ref "$GITHUB_SHA" \
            --manifest-dir out/release-preflight/public-sync

  # ── Create a draft GitHub Release up front ─────────────────────────
  # Build jobs attach their outputs to THIS release instead of using
  # actions/upload-artifact. Release assets do NOT count against the
  # Actions artifact-storage quota, so releases never get blocked by it.
  create-release:
    needs: [preflight]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create (or reset) draft release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Notes use a placeholder for the version; $(uname -m) and backticks
          # are intentionally left literal for the user to copy/run.
          cat > /tmp/notes.md <<'NOTES'
          ## litehttpd v__VERSION__

          Apache .htaccess compatibility module for OpenLiteSpeed (98 directive types, full CI/release-gate coverage).

          ### RPM Packages (x86_64)

          | Package | Description |
          |---------|-------------|
          | `openlitespeed-litehttpd-*.el8.x86_64.rpm` | Patched OLS + bundled module (EL 8) |
          | `openlitespeed-litehttpd-*.el9.x86_64.rpm` | Patched OLS + bundled module (EL 9) |
          | `openlitespeed-litehttpd-*.el10.x86_64.rpm` | Patched OLS + bundled module (EL 10) |
          | `litehttpd-*.el9.x86_64.rpm` | Standalone module RPM (EL 9) |

          ```bash
          # Install both (replaces stock OLS, enables php_value + RewriteRule)
          dnf install ./openlitespeed-litehttpd-*.$(uname -m).rpm
          dnf install ./litehttpd-*.$(uname -m).rpm

          # Or just the module (stock OLS, php_value/RewriteRule won't execute)
          dnf install ./litehttpd-*.$(uname -m).rpm
          ```

          ### Binary tarballs (distro-independent, glibc >= 2.28)

          Extract and run the bundled `install.sh` — like the official OLS tarball.

          | Tarball | Use when | Effect |
          |---------|----------|--------|
          | `openlitespeed-litehttpd-*-x86_64-linux.tgz` | Fresh install / no OLS yet | Installs the **complete patched OLS + module** to `/usr/local/lsws` |
          | `litehttpd-ols-patch-*-x86_64-linux.tgz` | You already run **official OLS (same version)** | Overlay: backs up & **replaces the binary** + adds module (full features) |
          | `litehttpd-module-*-x86_64-linux.tgz` | You already run **official OLS (any version)** | Overlay: **module only**, no binary change (RewriteRule/php_value not executed) |

          ```bash
          # Full install (no OLS yet)
          tar xzf openlitespeed-litehttpd-*-x86_64-linux.tgz
          cd openlitespeed-litehttpd-* && sudo ./install.sh

          # Already have official OLS — add full features (binary must match version)
          tar xzf litehttpd-ols-patch-*-x86_64-linux.tgz
          cd litehttpd-ols-patch-* && sudo ./install.sh

          # Already have official OLS — module only (any version)
          tar xzf litehttpd-module-*-x86_64-linux.tgz
          cd litehttpd-module-* && sudo ./install.sh
          ```

          ### .so Files (Ubuntu/Debian/Docker)

          | File | Platform |
          |------|----------|
          | `litehttpd_htaccess-el8-x86_64.so` | EL 8 x86_64 (also for OLS RPM) |
          | `litehttpd_htaccess-el9-x86_64.so` | EL 9 x86_64 |
          | `litehttpd_htaccess-el10-x86_64.so` | EL 10 x86_64 |
          | `litehttpd_htaccess-ubuntu22-x86_64.so` | Ubuntu 22.04+, Debian 12+ x86_64 |

          ### OLS Patches

          | Patch | Description |
          |-------|-------------|
          | `0001-lsiapi-phpconfig.patch` | PHPConfig + set_req_header LSIAPI extensions |
          | `0002-lsiapi-rewrite.patch` | RewriteRule engine LSIAPI extensions |
          | `0003-readapacheconf.patch` | readApacheConf startup integration |
          | `0004-autoindex-403.patch` | Options -Indexes returns 403 (match LSWS) |

          Apply in order: `patch -p1 < 0001-*.patch && patch -p1 < 0002-*.patch && patch -p1 < 0003-*.patch && patch -p1 < 0004-*.patch`

          ### Requirements
          - OpenLiteSpeed >= 1.7.0
          - Full OLS RPMs/tarballs are built on EL8 and require glibc >= 2.28
          - For `php_value`/`php_flag` + `RewriteRule`: install `openlitespeed-litehttpd` RPM or apply both patches
          NOTES
          sed -i "s/__VERSION__/${VERSION}/g" /tmp/notes.md

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft=true \
              --title "litehttpd v${VERSION}" --notes-file /tmp/notes.md
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while IFS= read -r asset; do
                [ -n "$asset" ] || continue
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              done
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "litehttpd v${VERSION}" --notes-file /tmp/notes.md
          fi

  # ── Build litehttpd .so for each platform ──────────────────────────
  build-module:
    needs: [create-release]
    strategy:
      matrix:
        include:
          - container: almalinux:8
            suffix: el8-x86_64
            platform: linux/amd64
            pkg_cmd: "yum -y install cmake3 gcc gcc-c++ git libxcrypt-devel pcre2-devel && (command -v cmake >/dev/null 2>&1 || ln -sf /usr/bin/cmake3 /usr/bin/cmake)"
          - container: almalinux:9
            suffix: el9-x86_64
            platform: linux/amd64
            pkg_cmd: "dnf -y install cmake gcc gcc-c++ git-core libxcrypt-devel pcre2-devel"
          - container: almalinux:10
            suffix: el10-x86_64
            platform: linux/amd64
            pkg_cmd: "dnf -y install cmake gcc gcc-c++ git-core libxcrypt-devel pcre2-devel"
          - container: ubuntu:22.04
            suffix: ubuntu22-x86_64
            platform: linux/amd64
            pkg_cmd: "apt-get update && apt-get install -y cmake gcc g++ git libcrypt-dev libpcre2-dev"

    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Build .so
        run: |
          mkdir -p output
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src:ro \
            -v ${{ github.workspace }}/output:/output \
            ${{ matrix.container }} \
            bash -c '
              set -e
              ${{ matrix.pkg_cmd }} 2>&1 | tail -2
              mkdir /tmp/build && cd /tmp/build
              tar cf - -C /src --exclude=build --exclude=.git . | tar xf -
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_C_FLAGS="-O2 -DNDEBUG"
              cmake --build build --target litehttpd_htaccess -j$(nproc)
              strip build/litehttpd_htaccess.so
              cp build/litehttpd_htaccess.so /output/litehttpd_htaccess-${{ matrix.suffix }}.so
            '

      - name: Attach .so to release
        run: |
          uploaded=0
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" \
              output/litehttpd_htaccess-${{ matrix.suffix }}.so --clobber; then
              uploaded=1
              break
            fi
            echo "upload retry $i"; sleep $((i*5))
          done
          [ "$uploaded" -eq 1 ]

  # ── Build litehttpd RPM (EL9, x86_64) ──────────────────────────────
  build-rpm-module:
    needs: [create-release]
    strategy:
      matrix:
        include:
          - container: almalinux:9
            platform: linux/amd64
            arch_suffix: x86_64

    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from spec
        id: ver
        run: echo "version=$(grep '^Version:' packaging/litehttpd.spec | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Build RPM
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p output
          tar czf "/tmp/litehttpd-${VERSION}.tar.gz" \
            --transform="s,^\.,litehttpd-${VERSION}," \
            --exclude=build --exclude=.git .

          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src:ro \
            -v "/tmp/litehttpd-${VERSION}.tar.gz:/tmp/litehttpd-${VERSION}.tar.gz:ro" \
            -v ${{ github.workspace }}/output:/output \
            -e VERSION="${VERSION}" \
            ${{ matrix.container }} \
            bash -c '
              set -e
              dnf -y install rpm-build cmake gcc gcc-c++ git-core libxcrypt-devel pcre2-devel 2>&1 | tail -2
              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp /tmp/litehttpd-${VERSION}.tar.gz /root/rpmbuild/SOURCES/
              rpmbuild -bb --define "_topdir /root/rpmbuild" /src/packaging/litehttpd.spec
              find /root/rpmbuild/RPMS -name "litehttpd-*.rpm" ! -name "*debug*" \
                -exec cp {} /output/ \;
              ls -lh /output/
            ' > /tmp/buildrpm.out 2>&1 || rc=$?
          cat /tmp/buildrpm.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if [ "$rc" -ne 0 ]; then
            echo "docker exited rc=$rc — last 40 lines:"
            tail -40 /tmp/buildrpm.out
            tail -12 /tmp/buildrpm.out | sed 's/^/::error:: /' || true
            exit "$rc"
          fi

      - name: Attach RPM to release
        run: |
          uploaded=0
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" output/litehttpd-*.rpm --clobber; then
              uploaded=1
              break
            fi
            echo "upload retry $i"; sleep $((i*5))
          done
          [ "$uploaded" -eq 1 ]

  # ── Build openlitespeed-litehttpd RPM (EL8/9/10, x86_64) ───────────
  build-rpm-ols:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          # All three built on EL8 (glibc 2.28) — matching official LiteSpeed.
          # This ensures the binary works on EL8/9/10 (only needs GLIBC_2.28).
          # Official LiteSpeed uses RHEL8 build host for all distros.
          - container: almalinux:8
            dist_tag: el8
            pkg_cmd: yum
            platform: linux/amd64
            asset_arch: x86_64
          - container: almalinux:8
            dist_tag: el9
            pkg_cmd: yum
            platform: linux/amd64
            asset_arch: x86_64
          - container: almalinux:8
            dist_tag: el10
            pkg_cmd: yum
            platform: linux/amd64
            asset_arch: x86_64

    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate patch and release target
        run: bash tests/check_patches.sh

      - name: Download OLS source
        run: |
          git config --global http.version HTTP/1.1 || true
          git config --global http.lowSpeedLimit 32768 || true
          git config --global http.lowSpeedTime 120 || true
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v1.9.4 \
            https://github.com/litespeedtech/openlitespeed.git /tmp/ols-src
          cd /tmp/ols-src && tar czf /tmp/v1.9.4.tar.gz --exclude=.git --transform="flags=r;s,^\.,openlitespeed-1.9.4," .

      - name: Create module source tarball
        run: |
          # Package the litehttpd repo as tarball for Source9 (no git clone inside Docker)
          tar czf /tmp/litehttpd-module-src.tar.gz \
            --transform="flags=r;s,^\.,litehttpd-module," \
            --exclude=.git --exclude=build --exclude=node_modules \
            -C ${{ github.workspace }} .

      - name: Create pinned source cache
        run: bash scripts/create-release-source-cache.sh /tmp

      - name: Build RPM
        run: |
          # Docker output goes to a file; on failure the tail is echoed
          # as ::error:: workflow commands so it lands in the CHECK
          # ANNOTATIONS (readable unauthenticated via the API) and in
          # the step summary — job logs themselves need admin auth.
          set -o pipefail
          rc=0
          mkdir -p output
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v ${{ github.workspace }}:/src:ro \
            -v /tmp/v1.9.4.tar.gz:/tmp/v1.9.4.tar.gz:ro \
            -v /tmp/litehttpd-module-src.tar.gz:/tmp/litehttpd-module-src.tar.gz:ro \
            -v /tmp/third-party-src.tar.gz:/tmp/third-party-src.tar.gz:ro \
            -v /tmp/third-party-deps-src.tar.gz:/tmp/third-party-deps-src.tar.gz:ro \
            -v /tmp/php-7.4.33.tar.gz:/tmp/php-7.4.33.tar.gz:ro \
            -v /tmp/php-litespeed-8.1.tgz:/tmp/php-litespeed-8.1.tgz:ro \
            -v ${{ github.workspace }}/output:/output \
            ${{ matrix.container }} \
            bash -c '
              set -e
              PKG=${{ matrix.pkg_cmd }}
              ASSET_ARCH=${{ matrix.asset_arch }}

              # ── Install build tools ──
              # OLS third-party libraries are built from litespeedtech/third-party,
              # matching official LiteSpeed. libcap/libaio/expat devel headers
              # satisfy upstream build-time checks; libxml2/zlib devel headers are
              # used to rebuild WebAdmin admin_php locally for the EL8 ABI.
              if command -v dnf &>/dev/null; then
                dnf -y install dnf-plugins-core
                # Lock glibc to keep minimum version requirement low.
                # versionlock may not be available on all distros (e.g. EL10
                # minimal) — warn but continue if it fails.
                if ! dnf versionlock add glibc glibc-devel glibc-headers glibc-common 2>/dev/null; then
                  echo "WARNING: glibc versionlock failed — binary may require newer glibc"
                fi
                dnf -y install rpm-build gcc gcc-c++ cmake make bison autoconf automake libtool \
                  systemd-rpm-macros which git wget clang patch perl golang binutils \
                  libcap-devel libaio-devel expat-devel libxml2-devel zlib-devel 2>&1 | tail -2
              else
                yum -y install rpm-build gcc gcc-c++ cmake3 make bison autoconf automake libtool \
                  systemd-rpm-macros which git wget clang patch perl binutils \
                  libcap-devel libaio-devel expat-devel libxml2-devel zlib-devel 2>&1 | tail -2
                yum -y install golang 2>&1 | tail -1 || true
                command -v cmake || ln -s /usr/bin/cmake3 /usr/bin/cmake 2>/dev/null || true
              fi

              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp /tmp/v1.9.4.tar.gz /root/rpmbuild/SOURCES/
              cp /src/patches/0001-lsiapi-phpconfig.patch /root/rpmbuild/SOURCES/
              cp /src/patches/0002-lsiapi-rewrite.patch /root/rpmbuild/SOURCES/
              cp /src/patches/0003-readapacheconf.patch /root/rpmbuild/SOURCES/
              cp /src/patches/0004-autoindex-403.patch /root/rpmbuild/SOURCES/
              cp /src/tools/apacheconf_parser.c /root/rpmbuild/SOURCES/
              cp /src/tools/apacheconf_parser.h /root/rpmbuild/SOURCES/
              cp /src/tools/ols_config_writer.c /root/rpmbuild/SOURCES/
              cp /src/tools/ols_config_writer.h /root/rpmbuild/SOURCES/
              cp /tmp/litehttpd-module-src.tar.gz /root/rpmbuild/SOURCES/
              cp /tmp/third-party-src.tar.gz /root/rpmbuild/SOURCES/
              cp /tmp/third-party-deps-src.tar.gz /root/rpmbuild/SOURCES/
              cp /tmp/php-7.4.33.tar.gz /root/rpmbuild/SOURCES/
              cp /tmp/php-litespeed-8.1.tgz /root/rpmbuild/SOURCES/
              # --noclean keeps BUILDROOT after packaging so the el8 leg can
              # assemble the binary tarballs from the install tree below.
              rpmbuild -bb --noclean --with source_cache --define "_topdir /root/rpmbuild" \
                --define "dist .${{ matrix.dist_tag }}" \
                /src/packaging/openlitespeed-litehttpd.spec
              find /root/rpmbuild/RPMS -name "openlitespeed-litehttpd-*.rpm" ! -name "*debug*" \
                -exec cp {} /output/ \;
              ls -lh /output/

              # Verify all patches and WebAdmin PHP in the installed tree.
              LSWS="$(find /root/rpmbuild/BUILDROOT -path "*/usr/local/lsws" -type d -print -quit)"
              [ -n "$LSWS" ] || { echo "FATAL: installed LSWS tree not found"; exit 1; }
              BIN="$LSWS/bin/openlitespeed"
              ADMINPHP="$LSWS/admin/fcgi-bin/admin_php"
              LSPHP5="$LSWS/fcgi-bin/lsphp5"
              [ -x "$BIN" ] || { echo "FATAL: openlitespeed binary missing from BUILDROOT"; exit 1; }
              P1=$(strings "$BIN" | grep -c "set_php_config_value")
              P2=$(strings "$BIN" | grep -c "parse_rewrite_rules")
              P3=$(strings "$BIN" | grep -c "readApacheConf")
              P4=$(strings "$BIN" | grep -c "indexes_disabled")
              echo "Patch verification: P1=$P1 P2=$P2 P3=$P3 P4=$P4"
              [ "$P1" -ge 1 ] && [ "$P2" -ge 1 ] && [ "$P3" -ge 1 ] && [ "$P4" -ge 1 ] || \
                { echo "FATAL: Patches missing from RPM binary!"; exit 1; }
              [ -x "$ADMINPHP" ] || { echo "FATAL: admin_php missing"; exit 1; }
              [ -x "$LSPHP5" ] || { echo "FATAL: lsphp5 missing"; exit 1; }
              "$ADMINPHP" -v 2>&1 | grep -q "PHP 7.4.33 (litespeed)" || \
                { echo "FATAL: admin_php is not the locally built litespeed PHP"; exit 1; }
              "$LSPHP5" -v >/dev/null 2>&1 || \
                { echo "FATAL: bundled lsphp5 cannot run"; exit 1; }
              if readelf -V "$ADMINPHP" 2>/dev/null | grep -Eq "GLIBC_2\\.(29|[3-9][0-9])"; then
                echo "FATAL: admin_php requires GLIBC newer than EL8 provides"
                readelf -V "$ADMINPHP" | grep -o "GLIBC_[0-9]\\+\\.[0-9]\\+" | sort -uV
                exit 1
              fi
              [ ! -e "$LSWS/adminpasswd" ] || \
                { echo "FATAL: build-time WebAdmin password is included in BUILDROOT"; exit 1; }
              [ ! -e "$LSWS/phpbuild" ] || \
                { echo "FATAL: phpbuild source/build artifacts are included in BUILDROOT"; exit 1; }

              # ── (el8 leg only) Assemble binary tarballs from the install tree ──
              # The patched binary/module are identical across el8/el9/el10 legs
              # for a given CPU architecture, so build the dist-agnostic tarballs once.
              if [ "${{ matrix.dist_tag }}" = "el8" ]; then
                OLSVER=$(grep "%global ols_version" /src/packaging/openlitespeed-litehttpd.spec | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
                MODVER=$(grep "^Version:" /src/packaging/litehttpd.spec | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
                [ -d "$LSWS" ] || { echo "FATAL: install tree not found at $LSWS (BUILDROOT cleaned?)"; exit 1; }
                PB="$LSWS/bin/openlitespeed"
                MOD="$LSWS/modules/litehttpd_htaccess.so"
                ST=/tmp/tarballs; rm -rf $ST; mkdir -p $ST
                echo "=== Assembling tarballs (OLS $OLSVER, module $MODVER) ==="

                # 1) Full standalone: complete patched OLS + module + installer
                FULL="openlitespeed-litehttpd-${OLSVER}"
                mkdir -p "$ST/$FULL/lsws"
                cp -a "$LSWS/." "$ST/$FULL/lsws/"
                echo TGZ > "$ST/$FULL/lsws/PLAT"
                install -m 755 /src/packaging/tarball/install-full.sh "$ST/$FULL/install.sh"
                tar czf /output/${FULL}-${ASSET_ARCH}-linux.tgz -C $ST "$FULL"
                ! tar tzf /output/${FULL}-${ASSET_ARCH}-linux.tgz | grep -Eq "(^|/)adminpasswd$|(^|/)phpbuild(/|$)" || \
                  { echo "FATAL: full tgz includes build-time password or PHP build artifacts"; exit 1; }

                # 2) Overlay B: patched binary + module + installer (version-locked)
                PATCH="litehttpd-ols-patch-${OLSVER}"
                mkdir -p "$ST/$PATCH"
                install -m 755 "$PB"  "$ST/$PATCH/openlitespeed"
                install -m 755 "$MOD" "$ST/$PATCH/litehttpd_htaccess.so"
                echo "$OLSVER" > "$ST/$PATCH/VERSION"
                install -m 755 /src/packaging/tarball/install-patch.sh "$ST/$PATCH/install.sh"
                tar czf /output/${PATCH}-${ASSET_ARCH}-linux.tgz -C $ST "$PATCH"

                # 3) Overlay A: module only + installer (version-independent)
                MODP="litehttpd-module-${MODVER}"
                mkdir -p "$ST/$MODP"
                install -m 755 "$MOD" "$ST/$MODP/litehttpd_htaccess.so"
                install -m 755 /src/packaging/tarball/install-module.sh "$ST/$MODP/install.sh"
                tar czf /output/${MODP}-${ASSET_ARCH}-linux.tgz -C $ST "$MODP"

                echo "=== Tarballs built ==="; ls -lh /output/*.tgz
              fi
            '

      - name: Attach RPM to release
        run: |
          uploaded=0
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" output/openlitespeed-litehttpd-*.rpm --clobber; then
              uploaded=1
              break
            fi
            echo "upload retry $i"; sleep $((i*5))
          done
          [ "$uploaded" -eq 1 ]

      - name: Attach binary tarballs to release
        if: matrix.dist_tag == 'el8'
        run: |
          uploaded=0
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" output/*.tgz --clobber; then
              uploaded=1
              break
            fi
            echo "upload retry $i"; sleep $((i*5))
          done
          [ "$uploaded" -eq 1 ]

  # ── Run tests ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          jobs="$(nproc)"
          cmake --build build --parallel "$jobs"
          ctest --test-dir build --output-on-failure --parallel "$jobs"

  # ── Publish RPM Repository to Cloudflare R2 ─────────────────────────
  # Pulls the (unsigned) RPMs straight from the release assets, signs them,
  # builds the yum metadata and syncs to R2. Independent of the GitHub
  # Release being finalized; gated on the RPM builds + tests passing.
  publish-rpm-repo:
    needs: [preflight, build-rpm-module, build-rpm-ols, test]
    # GPG/AWS publish secrets live only on the private repo's runners;
    # on the public mirror this job has nothing to sign with — skip it
    # there (the private pipeline performs the real repository publish,
    # verified live on rpms.litehttpd.com) instead of failing red.
    if: needs.preflight.outputs.can_publish == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Download RPMs + tarballs from release
        run: |
          mkdir -p artifacts
          gh release download "$GITHUB_REF_NAME" --dir artifacts --pattern '*.rpm'
          gh release download "$GITHUB_REF_NAME" --dir artifacts --pattern '*.tgz' || true
          ls -lh artifacts/

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y createrepo-c rpm gnupg2
          pip install awscli

      - name: Validate RPM repository inputs
        run: REPO_REQUIRE_FULL_MATRIX=1 bash scripts/check-rpm-repo-dry-run.sh artifacts

      - name: Import GPG key and configure signing
        run: |
          # Import key into isolated GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

          # Configure gpg-agent for passphrase (avoids command-line exposure)
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          gpg-connect-agent reloadagent /bye 2>/dev/null || true

          # Save GNUPGHOME for subsequent steps
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

          # Write passphrase to a temp file for gpg (avoids command-line exposure)
          echo "${{ secrets.GPG_PASSPHRASE }}" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"

          # RPM signing macros
          cat > ~/.rpmmacros << MACROS
          %_gpg_name WebCasaRPM
          %__gpg_sign_cmd %{__gpg} gpg --batch --yes --no-armor --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase -u '%{_gpg_name}' -sbo %{__signature_filename} %{__plaintext_filename}
          MACROS

      - name: Build repository structure
        run: |
          set -euo pipefail

          # Feed passphrase to gpg-agent (once, not per-file)
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 --sign --detach-sign /dev/null 2>/dev/null || true

          # Collect all RPMs
          mkdir -p repo-staging
          find artifacts -name "*.rpm" -exec cp {} repo-staging/ \;
          ls -lh repo-staging/

          # Sign all RPMs
          echo "=== Signing RPMs ==="
          for rpm_file in repo-staging/*.rpm; do
            echo "Signing: $(basename "$rpm_file")"
            rpmsign --addsign "$rpm_file"
          done

          # Create per-EL-version and per-architecture directories.
          for dist in el8 el9 el10; do
            for arch in x86_64; do
              mkdir -p "repo/$dist/$arch/RPMS"
              cp repo-staging/openlitespeed-litehttpd-*.$dist.$arch.rpm \
                "repo/$dist/$arch/RPMS/" 2>/dev/null || true
              # Module RPM is built for el9 only.
              if [ "$dist" = "el9" ]; then
                cp repo-staging/litehttpd-*.el9.$arch.rpm \
                  "repo/$dist/$arch/RPMS/" 2>/dev/null || true
              fi
              # Generate repodata
              createrepo_c "repo/$dist/$arch/"

              # Sign repomd.xml (enables repo_gpgcheck=1 on client)
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-file "$GNUPGHOME/passphrase" \
                --detach-sign --armor \
                "repo/$dist/$arch/repodata/repomd.xml"

              rpm_count="$(find "repo/$dist/$arch/RPMS" -maxdepth 1 -name '*.rpm' -type f | wc -l)"
              echo "Created repo: $dist/$arch ($rpm_count RPMs)"
            done
          done

          # Copy GPG public key and setup script to root
          cp packaging/RPM-GPG-KEY-litehttpd repo/
          cp packaging/setup-repo.sh repo/setup.sh

          # Publish the binary tarballs at the repo root so they get stable
          # URLs (https://rpms.litehttpd.com/<name>-x86_64-linux.tgz).
          find artifacts -maxdepth 1 -name '*.tgz' -type f -exec cp {} repo/ \;

          # Generate static index.html directory listings
          bash packaging/generate-index.sh repo

          echo "=== Repository structure ==="
          find repo -type f | sort

          # Cleanup GNUPGHOME
          rm -rf "$GNUPGHOME"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Sync to R2 (S3-compatible API)
          aws s3 sync repo/ "s3://${{ secrets.R2_BUCKET }}/" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --delete

          echo "=== Published to https://rpms.litehttpd.com/ ==="
          echo "Users can now run: curl -s https://rpms.litehttpd.com/setup.sh | bash"

  # ── Attach patches + checksums, then publish the release ───────────
  finalize-release:
    needs: [build-module, build-rpm-module, build-rpm-ols, publish-rpm-repo, test]
    if: ${{ always() && !cancelled() && (needs.publish-rpm-repo.result == 'success' || needs.publish-rpm-repo.result == 'skipped') }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Attach patches, generate SHA256SUMS, publish
        run: |
          # Attach the OLS patches (from the repo, not a build artifact)
          uploaded=0
          for i in 1 2 3; do
            if gh release upload "$GITHUB_REF_NAME" \
              patches/0001-lsiapi-phpconfig.patch \
              patches/0002-lsiapi-rewrite.patch \
              patches/0003-readapacheconf.patch \
              patches/0004-autoindex-403.patch --clobber; then
              uploaded=1
              break
            fi
            echo "upload retry $i"; sleep $((i*5))
          done
          [ "$uploaded" -eq 1 ]

          # Pull every asset back down and compute checksums over the full set
          mkdir -p rel
          gh release download "$GITHUB_REF_NAME" --dir rel
          RELEASE_REQUIRE_FULL_ARTIFACTS=1 bash scripts/check-release-artifacts.sh rel
          (
            cd rel
            rm -f SHA256SUMS
            tmp_sum="$(mktemp)"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > "$tmp_sum"
            mv "$tmp_sum" SHA256SUMS
          )
          gh release upload "$GITHUB_REF_NAME" rel/SHA256SUMS --clobber

          # Publish (remove draft flag)
          gh release edit "$GITHUB_REF_NAME" --draft=false
